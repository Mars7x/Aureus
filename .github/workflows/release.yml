name: Build Release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or branch to build"
        required: true
      upload:
        description: "Upload the builds to the GitHub release with this tag"
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  flatpak:
    name: Flatpak ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Aureus-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.Mars7x.Aureus.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          artifact-name: Aureus-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.flatpak

  windows:
    name: Windows x86_64
    runs-on: windows-2025

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gcc:p
            pkgconf:p
            rust:p
            gtk4:p
            libadwaita:p
            librsvg:p
            adwaita-icon-theme:p

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: scripts/package-windows.sh "Aureus-${RELEASE_TAG}-windows-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aureus-${{ env.RELEASE_TAG }}-windows-x86_64.zip
          path: dist/Aureus-${{ env.RELEASE_TAG }}-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita librsvg adwaita-icon-theme hicolor-icon-theme dylibbundler pkgconf
          rustup update stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        timeout-minutes: 15
        run: scripts/package-macos.sh "Aureus-${RELEASE_TAG}-macos-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aureus-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.zip
          path: dist/Aureus-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  upload:
    name: Upload release assets
    needs: [flatpak, windows, macos]
    # A Windows or macOS failure must not hold back the Flatpak assets of a
    # release.
    if: >-
      always() &&
      needs.flatpak.result == 'success' &&
      (github.event_name == 'release' || inputs.upload)
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Aureus-*
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${RELEASE_TAG}" \
            release-assets/*.flatpak \
            release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
