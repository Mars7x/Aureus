name: Build Flatpak Release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        default: "v1.2.1"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Aureus-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.Mars7x.Aureus.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: Aureus-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.flatpak

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Aureus-*.flatpak
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            release-assets/*.flatpak \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
